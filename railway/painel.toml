# Railway: serviço "painel" (Next.js), o único com domínio público. No Railway, este
# serviço usa Root Directory = /painel (o Dockerfile abaixo é relativo a ela).
# Ver docs/RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
