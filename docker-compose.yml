name: monitor-processual

# Só o painel é publicado para fora. Postgres, Redis, MinIO e OpenSearch ficam
# presos a 127.0.0.1 (acesso local de desenvolvimento); a API só é alcançável pela
# rede interna do compose. Integrações externas devem chegar à API por um proxy
# reverso com TLS (Caddy/Nginx) configurado na implantação.

x-backend: &backend
  build:
    context: .
  image: monitor-processual/backend:local
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-monitor}
    REDIS_URL: redis://redis:6379/0
    OPENSEARCH_URL: http://opensearch:9200
    MINIO_ENDPOINT: minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-monitor}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    MINIO_BUCKET_BRUTO: ${MINIO_BUCKET_BRUTO:-bruto}
    HASH_DOCUMENTO_CHAVE: ${HASH_DOCUMENTO_CHAVE:?defina HASH_DOCUMENTO_CHAVE no .env}
    SMTP_HOST: ${SMTP_HOST:-localhost}
    SMTP_PORTA: ${SMTP_PORTA:-587}
    SMTP_USUARIO: ${SMTP_USUARIO:-}
    SMTP_SENHA: ${SMTP_SENHA:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    SMTP_REMETENTE: ${SMTP_REMETENTE:-Monitor Processual <alertas@localhost>}
    EMAIL_OPERACAO: ${EMAIL_OPERACAO:-}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-monitor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      # Apenas para desenvolvimento local. Em produção, habilitar o plugin de segurança e TLS.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Roda as migrações Alembic uma vez e termina; os demais serviços esperam por ele.
  migracoes:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    expose:
      - "8000"
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agendador:
    <<: *backend
    command: ["python", "-m", "agendador"]
    healthcheck:
      disable: true
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  painel:
    build:
      context: ./painel
    image: monitor-processual/painel:local
    restart: unless-stopped
    environment:
      MONITOR_API_URL: http://api:8000
    ports:
      - "${PAINEL_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  opensearch_data:
