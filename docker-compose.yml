name: monitor-processual

# Só o painel é publicado para fora. Postgres, Redis, SeaweedFS (S3), OpenSearch, Prometheus e
# Grafana ficam presos a 127.0.0.1 (acesso local/túnel SSH); a API só é alcançável pela
# rede interna do compose. Integrações externas devem chegar à API por um proxy
# reverso com TLS (Caddy/Nginx) configurado na implantação.

x-backend: &backend
  build:
    context: .
  image: monitor-processual/backend:local
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-monitor}
    REDIS_URL: redis://redis:6379/0
    OPENSEARCH_URL: http://opensearch:9200
    S3_ENDPOINT: seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-monitor}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    S3_BUCKET_BRUTO: ${S3_BUCKET_BRUTO:-bruto}
    COLETOR_CONTATO: ${COLETOR_CONTATO:-}
    COLETOR_MAX_PAGINAS: ${COLETOR_MAX_PAGINAS:-20}
    COLETOR_CACHE_HORAS: ${COLETOR_CACHE_HORAS:-24}
    HASH_DOCUMENTO_CHAVE: ${HASH_DOCUMENTO_CHAVE:?defina HASH_DOCUMENTO_CHAVE no .env}
    SMTP_HOST: ${SMTP_HOST:-localhost}
    SMTP_PORTA: ${SMTP_PORTA:-587}
    SMTP_USUARIO: ${SMTP_USUARIO:-}
    SMTP_SENHA: ${SMTP_SENHA:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    SMTP_REMETENTE: ${SMTP_REMETENTE:-Monitor Processual <alertas@localhost>}
    EMAIL_OPERACAO: ${EMAIL_OPERACAO:-}
    LOG_FORMATO: ${LOG_FORMATO:-json}
    LOG_NIVEL: ${LOG_NIVEL:-INFO}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Armazenamento S3 do HTML bruto. O MinIO deixou de publicar imagens gratuitas; o
  # SeaweedFS fala o mesmo protocolo S3. Credencial por AWS_ACCESS_KEY_ID/SECRET: sem ela
  # o S3 ficaria aberto, por isso a senha é obrigatória.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: ["server", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-monitor}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      # Apenas para desenvolvimento local. Em produção, habilitar o plugin de segurança e TLS.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Roda as migrações Alembic uma vez e termina; os demais serviços esperam por ele.
  migracoes:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    expose:
      - "8000"
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agendador:
    <<: *backend
    command: ["python", "-m", "agendador"]
    # Métricas Prometheus só na rede interna (coletadas pelo serviço prometheus).
    expose:
      - "9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migracoes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  painel:
    build:
      context: ./painel
    image: monitor-processual/painel:local
    restart: unless-stopped
    environment:
      MONITOR_API_URL: http://api:8000
    ports:
      - "${PAINEL_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - agendador

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USUARIO:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA:?defina GRAFANA_SENHA no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/monitor-processual.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
