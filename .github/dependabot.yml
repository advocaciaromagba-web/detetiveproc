# PRs semanais de atualização de dependências, agrupados para não encher a fila.
# As correções de falhas conhecidas (alertas e "security updates") se ligam em
# Settings -> Code security do repositório. Toda atualização passa pela CI antes do merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /painel
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      painel:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /painel]
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
