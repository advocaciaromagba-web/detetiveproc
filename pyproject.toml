[project]
name = "monitor-processual"
version = "0.1.0"
description = "Monitoramento de distribuição processual contra CPFs e CNPJs monitorados"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=3.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "redis>=5.0,<6",
    "sqlalchemy[asyncio]>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/adaptadores", "src/db", "src/pipeline", "src/regras", "src/entrega"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ANN", "N", "C4", "PT", "RET", "PL", "ASYNC", "S",
]
ignore = [
    "PLR2004",  # números mágicos: dígitos verificadores usam constantes da norma
    "N818",     # nomes das exceções são os definidos na especificação (seção 4)
    "RUF001",   # caracteres ambíguos em strings (texto em português)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["core", "adaptadores", "db", "pipeline", "regras", "entrega"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fakeredis", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integracao: exige PostgreSQL real em TEST_DATABASE_URL (pulado sem ela)",
]
